kind = "web"
previewPath = "/"
title = "Chess Star"
version = "1.0.0"
id = "artifacts/chess-star"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25566

[services.development]
run = "pnpm --filter @workspace/chess-star run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chess-star", "run", "build" ]
publicDir = "artifacts/chess-star/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25566"
BASE_PATH = "/"
